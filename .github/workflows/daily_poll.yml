name: Ежедневный опрос в канал (вручную)

# По расписанию опрос публикует бот на Render: адрес /cron/daily-poll в
# нужное время вызывает cron-job.org. Расписание GitHub Actions для этого не
# годится — запуски опаздывают на час и пропадают. Здесь — только ручной
# запуск, например если внешний вызов не сработал.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Опубликовать, даже если опрос за сегодня уже вышел"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Публикация опроса
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python -m scripts.post_today_poll
