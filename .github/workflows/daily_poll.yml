name: Ежедневный опрос в канал

on:
  schedule:
    # 07:00 UTC = 12:00 по Астане. GitHub может запустить с опозданием
    # на 5–30 минут, если у него очередь.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-poll
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Публикация опроса
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python -m scripts.post_today_poll
